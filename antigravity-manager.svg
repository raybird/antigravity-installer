<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Antigravity Manager</title>
  <desc>A sculpted blue-violet arch with an upward arrow carved into its center, symbolizing Antigravity being lifted to the next version.</desc>
  <defs>
    <linearGradient id="ceramic" x1="0" y1="0" x2="0.8" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8ECF5"/>
    </linearGradient>
    <linearGradient id="lift" x1="0.1" y1="0.95" x2="0.8" y2="0.05">
      <stop stop-color="#2055C9"/>
      <stop offset="0.45" stop-color="#376CF0"/>
      <stop offset="1" stop-color="#8051E8"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C5CEE1"/>
    </linearGradient>
    <mask id="upgrade" maskUnits="userSpaceOnUse" x="64" y="64" width="384" height="384">
      <rect x="64" y="64" width="384" height="384" fill="#FFFFFF"/>
      <path d="M256 199 184 276 H222 V420 H290 V276 H328 Z" fill="#000000" stroke="#000000" stroke-width="8" stroke-linejoin="round"/>
    </mask>
  </defs>
  <rect x="32" y="36" width="448" height="448" rx="104" fill="#233D77" opacity="0.12"/>
  <rect x="32" y="28" width="448" height="448" rx="104" fill="url(#ceramic)"/>
  <rect x="33" y="29" width="446" height="446" rx="103" fill="none" stroke="url(#rim)" stroke-width="2"/>
  <!-- The arrow is negative space within one product-inspired silhouette. -->
  <path d="M256 112 C185 112 180 260 111 353 C88 384 103 407 133 392 C180 369 210 359 256 359 C302 359 332 369 379 392 C409 407 424 384 401 353 C332 260 327 112 256 112 Z" fill="url(#lift)" mask="url(#upgrade)"/>
</svg>
